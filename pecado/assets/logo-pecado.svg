<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-labelledby="pecadoLogoTitle">
  <title id="pecadoLogoTitle">Pecado — manzana de cristal con serpiente</title>
  <defs>
    <radialGradient id="appleGlass" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e6273f" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#a3101f" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#4a0510" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#12030a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="snakeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0306"/>
      <stop offset="50%" stop-color="#050101"/>
      <stop offset="100%" stop-color="#1a0306"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fondo: necesario para que la "mordida" funcione visualmente sobre negro -->
  <rect width="240" height="280" fill="#000000"/>

  <!-- tallo -->
  <path d="M120,72 C126,56 134,44 149,28" fill="none" stroke="#6b0f1a" stroke-width="6" stroke-linecap="round"/>

  <!-- hoja -->
  <path d="M120,68 C108,48 90,34 72,38 C85,56 98,68 118,73 Z" fill="#4a0512" stroke="#7a1424" stroke-width="1.5"/>

  <!-- cuerpo de la manzana (cristal/líquido rojo) -->
  <path d="M120,70 C90,40 40,55 30,110 C22,155 45,205 85,225 C100,233 108,238 120,250
           C132,238 140,233 155,225 C195,205 218,155 210,110 C200,55 150,40 120,70 Z"
        fill="url(#appleGlass)" filter="url(#softGlow)"/>

  <!-- reflejo de cristal -->
  <ellipse cx="82" cy="105" rx="20" ry="34" fill="#ffffff" opacity="0.10" transform="rotate(-18 82 105)"/>

  <!-- serpiente enroscada -->
  <path d="M52,150 C36,190 68,228 110,216 C150,204 132,168 96,174 C70,178 58,154 80,138
           C112,116 152,138 162,175 C170,204 196,196 197,164"
        fill="none" stroke="url(#snakeBody)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M52,150 C36,190 68,228 110,216 C150,204 132,168 96,174 C70,178 58,154 80,138
           C112,116 152,138 162,175 C170,204 196,196 197,164"
        fill="none" stroke="#c41e3a" stroke-width="1.4" stroke-linecap="round" opacity="0.28"/>

  <!-- cabeza de la serpiente -->
  <ellipse cx="200" cy="160" rx="10" ry="7" fill="#0a0202" transform="rotate(35 200 160)"/>
  <circle cx="203" cy="156" r="1.4" fill="#e8c7c7"/>
  <path d="M208,163 L216,169" stroke="#8b0000" stroke-width="1.2" stroke-linecap="round"/>

  <!-- mordida (mismo color que el fondo para simular el bocado) -->
  <circle cx="178" cy="96" r="34" fill="#000000"/>
</svg>
